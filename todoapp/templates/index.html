<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="{% static 'style.css' %}" rel="stylesheet">
    <title>TODO App</title>
    
</head>
<body id="pagecontainer">
        <div id="rcorners", class="center">
            {%for task in task_list%}
                <div class="task" style="background: {{task.color}}">
                    <p>{{ task.title }}</p>
                    <button name="remove_task" id="rmv" task-id = {{task.id}}>x</button>
                </div>
            {%endfor%}
        </div>
        {% if is_form == False %}
            <button name="add" id="add_task">Добавить</button>
        {% endif %}
        <script src="{% static 'index.js' %}"></script>
        {% if is_form == True %}
            <form action="" method="post">
                <label for="title">Название : </label>
                    <input
                        id="title"
                        type="text"
                        name="title_field"/>
                <label for="description">Описание : </label>
                    <input
                        id="description"
                        type="text"
                        name="desc_field"/>
                <label for="color">Цвет : </label>
                    <input
                        id="color"
                        type="color"
                        name="color_picker"
                        value="#00ff00"/>
                    <input id="OK" type="submit" value="OK"/>
            </form>
        {% endif %}
</body>
</html>
